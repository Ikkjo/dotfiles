# psmux-compatible counterpart to .tmux.conf
# Keep shared key bindings and behavior aligned with the tmux configuration.

# Remap prefix from C-b to C-a.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and -.
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Switch panes using Alt+h/j/k/l without the prefix.
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Reload this Windows-specific configuration.
bind r source-file ~/.psmux.conf

set -g mouse on
set-option -g automatic-rename off
set -g visual-bell off
set -g bell-action none
set -g mode-keys vi
bind v copy-mode

# Rose Pine-inspired status styling. psmux does not run TPM plugins, so the
# equivalent appearance is configured with native style options.
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left-style "bg=#31748f,fg=#191724,bold"
set -g status-right-style "bg=#191724,fg=#9ccfd8"
set -g pane-border-style "fg=#6e6a86"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#26233a,fg=#e0def4"
set -g mode-style "bg=#ebbcba,fg=#191724"
set -g window-status-style "fg=#908caa"
set -g window-status-current-style "fg=#e0def4,bold"
set -g status-left " #S "
set -g status-right " #H | %H:%M "
